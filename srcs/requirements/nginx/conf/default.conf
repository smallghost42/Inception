upstream wordpress_php{
  server $URL:9000
}

server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name $URL;
        
        ssl_certificate /etc/ssl/certs/nginx.crt;
        ssl_certificate_key /etc/ssl/private/nginx.key;

        ssl_protocols TLSv1.3;
       
        index.php

        location ~ \.php$ {
          try_files $uri =404;
          fastcgi_pass https://$URL;
          fastcgi_index index.php;
          include fastcgi_params;
        }
}
