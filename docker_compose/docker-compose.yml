version: '3.8'

services:
  nginx:
    build: .
    container_name: my-nginx-ssl-container
    ports:
      - "443:443" # Maps host port 443 to container port 443
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf/default.conf:/etc/nginx/http.d/default.conf:ro
      # If your Dockerfile doesn't generate SSL, and you have them on host:
      # - ./ssl/certs/nginx.crt:/etc/ssl/certs/nginx.crt:ro
      # - ./ssl/private/nginx.key:/etc/ssl/private/nginx.key:ro
    depends_on:
      - backend_app # If your Nginx depends on a backend service
    # Optional: If you use the upstream name 'backend_app' directly, no need for fixed IP
    # networks:
    #   - my_app_network # If you have custom networks

  backend_app: # Your backend service
    # ... backend configuration ...
    expose:
      - "9000" # Exposes port 9000 internally to linked services
